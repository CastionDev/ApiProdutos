<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
        }

        input {
            padding: 6px;
            margin: 2px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 6px 10px;
            margin: 2px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-edit {
            background: #3182ce;
            color: white;
        }

        .btn-delete {
            background: #e53e3e;
            color: white;
        }

        .btn-save {
            background: #38a169;
            color: white;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        a {
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">
            <h1>📋 Produtos</h1>
            <a href="index.html">+ Novo Produto</a>
        </div>

        <div id="lista"></div>

    </div>

    <script>
const api = "https://localhost:7128/api/ProductApi";

async function carregar() {
    const res = await fetch(api);
    const data = await res.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    data.forEach(p => {
        lista.innerHTML += `
            <div class="item">
                <div>
                    <input value="${p.nome}" id="nome-${p.id}">
                    <input value="${p.preco}" type="number" id="preco-${p.id}">
                    <input value="${p.quantidade}" type="number" id="qtd-${p.id}">
                </div>

                <div>
                    <button class="btn-save" onclick="salvar(${p.id})">Salvar</button>
                    <button class="btn-delete" onclick="deletar(${p.id})">Excluir</button>
                </div>
            </div>
        `;
    });
}

async function salvar(id) {
    const produto = {
        nome: document.getElementById(`nome-${id}`).value,
        preco: parseFloat(document.getElementById(`preco-${id}`).value),
        quantidade: parseInt(document.getElementById(`qtd-${id}`).value),
        descricao: ""
    };

    await fetch(`${api}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(produto)
    });

    alert("Atualizado!");
}

async function deletar(id) {
    if (!confirm("Tem certeza que deseja excluir?")) return;

    await fetch(`${api}/${id}`, { method: "DELETE" });
    carregar();
}

carregar();
    </script>

</body>
</html>
